<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 80 640 640">
  <defs>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        13.89% { transform: rotate(0deg); }
        16.67% { transform: rotate(60deg); }
        30.56% { transform: rotate(60deg); }
        33.33% { transform: rotate(120deg); }
        47.22% { transform: rotate(120deg); }
        50.00% { transform: rotate(180deg); }
        63.89% { transform: rotate(180deg); }
        66.67% { transform: rotate(240deg); }
        80.56% { transform: rotate(240deg); }
        83.33% { transform: rotate(300deg); }
        97.22% { transform: rotate(300deg); }
        100% { transform: rotate(360deg); }
      }
      .wheel {
        transform-origin: 400px 400px;
        animation: spin 72s infinite;
      }
    </style>
    <mask id="centerGap">
      <rect width="800" height="800" fill="white"/>
      <circle cx="400" cy="400" r="110" fill="black"/>
    </mask>
  </defs>

  <g class="wheel">
    <g stroke="white" stroke-width="12" fill="none" mask="url(#centerGap)">
      <line x1="400" y1="200" x2="573.205" y2="300"/>
      <line x1="573.205" y1="300" x2="573.205" y2="500"/>
      <line x1="573.205" y1="500" x2="400" y2="600"/>
      <line x1="400" y1="600" x2="226.795" y2="500"/>
      <line x1="226.795" y1="500" x2="226.795" y2="300"/>
      <line x1="226.795" y1="300" x2="400" y2="200"/>
      <line x1="400" y1="400" x2="400" y2="200"/>
      <line x1="400" y1="400" x2="573.205" y2="300"/>
      <line x1="400" y1="400" x2="573.205" y2="500"/>
      <line x1="400" y1="400" x2="400" y2="600"/>
      <line x1="400" y1="400" x2="226.795" y2="500"/>
      <line x1="400" y1="400" x2="226.795" y2="300"/>
    </g>

    <g fill="black">
      <circle cx="400" cy="200" r="50"/>
      <circle cx="573.205" cy="300" r="50"/>
      <circle cx="573.205" cy="500" r="50"/>
      <circle cx="400" cy="600" r="50"/>
      <circle cx="226.795" cy="500" r="50"/>
      <circle cx="226.795" cy="300" r="50"/>
    </g>

    <g fill="white">
      <circle cx="400" cy="200" r="40"/>
      <circle cx="573.205" cy="300" r="40"/>
      <circle cx="573.205" cy="500" r="40"/>
      <circle cx="400" cy="600" r="40"/>
      <circle cx="226.795" cy="500" r="40"/>
      <circle cx="226.795" cy="300" r="40"/>
    </g>
  </g>

